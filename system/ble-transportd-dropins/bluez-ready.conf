# Drop-in for /etc/systemd/system/ble-transportd.service.d/bluez-ready.conf
# Do NOT install into /usr/lib (rootfs integrity signed).
#
# IQ-link (iqlink UUID 73f2c710) and settings transport (73f2c600) share hci0.
# Delay settings transport so iqlink can RegisterApplication/Advertise first
# after reboot (paired reconnect stability).
[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 45); do if bluetoothctl show 2>/dev/null | grep -q "Powered: yes"; then break; fi; echo "Waiting for BlueZ Powered=true..."; sleep 1; done'
# Give manager/iqlinkd ~20s head start on GATT+ADV before settings transport.
ExecStartPre=/bin/sleep 20
